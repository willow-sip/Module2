<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 2 Stage 5</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h2>Card Title</h2>
    </header>
    <main>
        <article class="card animate" onclick="clickCard(this)">
            <figure>
                <img src="https://i.pinimg.com/736x/2b/fb/03/2bfb033ef2fa57a3144d29cfd8472e06.jpg"
                    alt="just some image" />
            </figure>
            <section>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestiae
                delectus voluptas perferendis fugiat non, quia quos eius fugit debitis
                quo! Voluptate animi sit perspiciatis voluptatum atque praesentium
                exercitationem, iste id?
            </section>
        </article>
    </main>

    <script>
        function clickCard(card) {
            card.classList.toggle('clicked');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const card = document.querySelector(".card");
            card.addEventListener("animationend", () => {
                card.classList.remove("animate");
            });
        });
    </script>
</body>

</html>
